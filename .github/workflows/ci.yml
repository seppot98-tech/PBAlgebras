name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: numerical verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r verify/requirements.txt
      - name: Run tests
        run: cd verify && python -m pytest tests -q
      - name: Quick constants run
        run: cd verify && python experiments/run_all.py --quick

  paper:
    name: build the paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a minimal TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-science latexmk
      - name: Build
        run: cd paper && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Fail on unresolved references
        run: |
          if grep -qE "Warning: (Reference|Citation).*undefined" paper/main.log; then
            grep -E "Warning: (Reference|Citation).*undefined" paper/main.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pbalgebras-paper
          path: paper/main.pdf
